name: excalibr
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy>=2.0
  - scipy>=1.14
  - pandas
  - scikit-learn
  - matplotlib
  - seaborn
  - numba
  - joblib
  - tqdm
  - ipykernel
  - jupyterlab
  - fire
  - ffmpeg
  - adjusttext
  - pip
  - pip:
    # JAX with CUDA 12 — bundles nvidia-* runtime libs, no module load cuda needed.
    # For CPU-only installs use excalibr.yml instead.
    # 0.4.38 is the last release whose jaxlib and nvidia-* deps are on standard PyPI.
    # Newer versions (0.5+) require nvidia packages hosted only on pypi.nvidia.com.
    - --extra-index-url https://pypi.nvidia.com/
    - jax[cuda12]==0.4.38
