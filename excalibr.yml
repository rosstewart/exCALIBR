name: excalibr
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy>=2.0
  - scipy>=1.14
  - pandas
  - scikit-learn
  - matplotlib
  - seaborn
  - numba
  - joblib
  - tqdm
  - ipykernel
  - jupyterlab
  - fire
  - ffmpeg
  - adjusttext
  - pip
  - pip:
    # JAX with CUDA 12 — bundles its own nvidia-* runtime libs, no module load needed.
    # For CPU-only installs (no GPU), replace with: jax==0.10.2
    - jax[cuda12]==0.10.2
    - jaxlib==0.10.2
