[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "assay-calibration"
dynamic = ["version"]  # from the git tag via setuptools-scm
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fire>=0.7.0",
    "joblib>=1.5.1",
    "matplotlib>=3.10.3",
    "numpy>=2.2.6",
    "pandas>=2.3.1",
    "plotly>=6.9.0",
    "scikit-learn>=1.7.0",
    "scipy>=1.15.3",
    "tqdm>=4.67.1",
]

[dependency-groups]
dev = [
    "matplotlib>=3.10.3",
    "seaborn>=0.13.2",
]

[tool.setuptools_scm]
# Used when there is no git metadata (e.g. a GitHub "Download ZIP").
fallback_version = "0.0.0+unknown"
